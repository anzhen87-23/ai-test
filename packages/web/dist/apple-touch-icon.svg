<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square (iOS style) -->
  <rect x="0" y="0" width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- AI text -->
  <text x="90" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="700" fill="url(#text)" text-anchor="middle">AI</text>
  <!-- Decorative sparkle dot -->
  <circle cx="135" cy="50" r="8" fill="#fbbf24" opacity="0.9"/>
  <circle cx="135" cy="50" r="4" fill="#fde68a"/>
</svg>
